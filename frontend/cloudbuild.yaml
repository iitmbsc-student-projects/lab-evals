# Cloud Build pipeline for the lab-evals frontend (Vue 3 + Vite).
#
# Manual trigger:  gcloud builds submit --config=frontend/cloudbuild.yaml frontend/
# Automatic:       wire a Cloud Build GitHub trigger to this file on push to master.
#
# VITE_API_BASE and VITE_GOOGLE_CLIENT_ID are pulled from Secret Manager at build
# time and baked into the static bundle. Update the secret + redeploy to rotate.
#
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/vite-api-base/versions/latest
      env: VITE_API_BASE
    - versionName: projects/${PROJECT_ID}/secrets/google-client-id/versions/latest
      env: VITE_GOOGLE_CLIENT_ID

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: install
    name: oven/bun:1
    entrypoint: bun
    args: [install, --frozen-lockfile]

  - id: build
    name: oven/bun:1
    entrypoint: bash
    secretEnv: [VITE_API_BASE, VITE_GOOGLE_CLIENT_ID]
    args:
      - -c
      - |
        set -euo pipefail
        export VITE_API_BASE
        export VITE_GOOGLE_CLIENT_ID
        # build-only = vite build without the parallel vue-tsc type-check.
        # Type-checking is a dev/PR-check concern; the deploy pipeline only
        # needs the static bundle. Run `bun run type-check` locally to enforce.
        bun run build-only

  - id: deploy
    name: node:20-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        npx -y firebase-tools@13 deploy \
          --only hosting \
          --project=${PROJECT_ID} \
          --non-interactive
