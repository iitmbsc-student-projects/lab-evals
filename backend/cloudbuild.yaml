# Cloud Build pipeline for the lab-evals backend.
#
# Build root is the REPO ROOT (the GitHub trigger checks out the whole repo),
# so the docker step uses `-f backend/Dockerfile backend` (Dockerfile path +
# build context), NOT `.`.
# Manual deploy (from repo root):  gcloud builds submit --config=backend/cloudbuild.yaml .
# Automatic:       wire a Cloud Build GitHub trigger to this file on push to master.
#
# Substitutions (override with --substitutions=_KEY=value):
#   _REGION              deploy region                  (default: asia-south1)
#   _AR_REPO             Artifact Registry repo name    (default: lab-evals)
#   _SERVICE             Cloud Run service name         (default: lab-evals-backend)
#   _SQL_INSTANCE_NAME   Cloud SQL instance name        (default: lab-evals-db)
#   _RUNTIME_SA_NAME     backend runtime SA short name  (default: lab-evals-backend-sa)
#   _FRONTEND_ORIGIN     CORS allowlist                 (default: https://lab-evals.web.app)
#   _ADMIN_EMAIL         bootstrap admin email
#   _ADMIN_NAME          bootstrap admin display name
#
# NOTE: Cloud Build does not recurse-substitute defaults in this block, so
# ${PROJECT_ID} is composed at usage sites (in the steps below), not here.

substitutions:
  _REGION: asia-south1
  _AR_REPO: lab-evals
  _SERVICE: lab-evals-backend
  _SQL_INSTANCE_NAME: lab-evals-db
  _RUNTIME_SA_NAME: lab-evals-backend-sa
  _FRONTEND_ORIGIN: https://lab-evals.web.app
  _ADMIN_EMAIL: admin@example.com
  _ADMIN_NAME: Admin

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/backend:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/backend:latest

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/backend:${BUILD_ID}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/backend:latest
      - -f
      - backend/Dockerfile
      - backend

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/backend

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/backend:${BUILD_ID}
      - --region=${_REGION}
      - --platform=managed
      - --service-account=${_RUNTIME_SA_NAME}@${PROJECT_ID}.iam.gserviceaccount.com
      - --add-cloudsql-instances=${PROJECT_ID}:${_REGION}:${_SQL_INSTANCE_NAME}
      - --set-secrets=JWT_SECRET=jwt-secret:latest,GOOGLE_CLIENT_ID=google-client-id:latest,DATABASE_URL=database-url:latest
      - --set-env-vars=ENV=production,JWT_ALGORITHM=HS256,JWT_EXPIRES_MINUTES=60,ADMIN_EMAIL=${_ADMIN_EMAIL},ADMIN_NAME=${_ADMIN_NAME},FRONTEND_ORIGIN=${_FRONTEND_ORIGIN}
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=2
      - --cpu=1
      - --memory=512Mi
      - --port=8000
      - --quiet
