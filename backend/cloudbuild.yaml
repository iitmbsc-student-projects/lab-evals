# Cloud Build pipeline for the lab-evals backend.
#
# Manual trigger:  gcloud builds submit --config=backend/cloudbuild.yaml backend/
# Automatic:       wire a Cloud Build GitHub trigger to this file on push to master.
#
# Substitutions (override with --substitutions=_KEY=value):
#   _REGION             deploy region                 (default: asia-south1)
#   _AR_REPO            Artifact Registry repo name   (default: lab-evals)
#   _SERVICE            Cloud Run service name        (default: lab-evals-backend)
#   _SQL_INSTANCE       Cloud SQL connection name     (default: $PROJECT_ID:asia-south1:lab-evals-db)
#   _RUNTIME_SA         backend runtime service acct  (default: lab-evals-backend-sa@$PROJECT_ID.iam.gserviceaccount.com)
#   _FRONTEND_ORIGIN    CORS allowlist                (default: https://lab-evals.web.app)
#   _ADMIN_EMAIL        bootstrap admin email
#   _ADMIN_NAME         bootstrap admin display name

substitutions:
  _REGION: asia-south1
  _AR_REPO: lab-evals
  _SERVICE: lab-evals-backend
  _SQL_INSTANCE: ${PROJECT_ID}:asia-south1:lab-evals-db
  _RUNTIME_SA: lab-evals-backend-sa@${PROJECT_ID}.iam.gserviceaccount.com
  _FRONTEND_ORIGIN: https://lab-evals.web.app
  _ADMIN_EMAIL: admin@example.com
  _ADMIN_NAME: Admin

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/backend:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/backend:latest

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/backend:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/backend:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/backend

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/backend:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --service-account=${_RUNTIME_SA}
      - --add-cloudsql-instances=${_SQL_INSTANCE}
      - --set-secrets=JWT_SECRET=jwt-secret:latest,GOOGLE_CLIENT_ID=google-client-id:latest,DATABASE_URL=database-url:latest
      - --set-env-vars=ENV=production,JWT_ALGORITHM=HS256,JWT_EXPIRES_MINUTES=60,ADMIN_EMAIL=${_ADMIN_EMAIL},ADMIN_NAME=${_ADMIN_NAME},FRONTEND_ORIGIN=${_FRONTEND_ORIGIN}
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=2
      - --cpu=1
      - --memory=512Mi
      - --port=8000
      - --quiet
